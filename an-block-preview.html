import {AN_BLOCK_SCALE as scale,AN_BLOCK_ORIGIN_X as ox,AN_BLOCK_ORIGIN_Y as oy,AN_BLOCK_FRAMES as count,AN_BLOCK_DURATION as duration} from '/src/an-block.ts';
import {getHurtboxes} from '/src/geometry.ts';
const audio=new Audio('/audio/an-block-loop.wav');audio.loop=true;let audioOn=false;document.querySelector('#audio').onclick=()=>{audioOn=!audioOn;document.querySelector('#audio').textContent=audioOn?'Âm thanh: BẬT':'Âm thanh: TẮT';if(!audioOn)audio.pause();};
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),slider=document.querySelector('#frame');let running=false,face=1,last=performance.now(),time=0;
const pages=await Promise.all(Array.from({length:Math.ceil(count/4)},(_,i)=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=`/characters/an/block-pages/${i}.webp`})));
slider.max=count;document.querySelector('#play').onclick=()=>{running=!running;time=(+slider.value-1)/24};slider.oninput=()=>running=false;for(const [id,step] of [['prev',-1],['next',1]])document.querySelector('#'+id).onclick=()=>{running=false;slider.value=Math.max(1,Math.min(count,+slider.value+step))};document.querySelector('#flip').onclick=()=>face=-face;
function draw(now){if(running&&audioOn){if(audio.paused){audio.currentTime=(+slider.value-1)/24;audio.play().catch(()=>{});}}else audio.pause();if(running){time=(time+(now-last)/1000)%duration;slider.value=Math.floor(time*24)+1}last=now;const i=+slider.value-1,k=i%4;ctx.clearRect(0,0,1280,720);ctx.save();ctx.translate(640,665);ctx.scale(face*scale,scale);ctx.drawImage(pages[Math.floor(i/4)],k%2*768,Math.floor(k/2)*432,768,432,-ox,-oy,768,432);ctx.restore();const f={collisionSkin:'an',character:'moon',x:640,y:0,face,action:'idle',time:0,hp:300,guard:true};for(const p of getHurtboxes(f)){ctx.beginPath();p.points.forEach((v,j)=>j?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));ctx.closePath();ctx.strokeStyle=p.region==='head'?'#ffdd55':'#00ee88';ctx.fillStyle=p.region==='head'?'#ffdd5533':'#00ee8833';ctx.lineWidth=2;ctx.fill();ctx.stroke()}document.querySelector('#label').textContent=`Frame nguồn ${i+62} · ${i+1}/${count}`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
