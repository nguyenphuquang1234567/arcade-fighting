<!doctype html><meta charset="utf-8"><title>Hitbox / hurtbox chém Yuki</title><style>body{background:#182131;color:white;text-align:center;font:16px system-ui}canvas{background:#536575;max-width:100%;height:auto}button,input{margin:8px}</style><h3>CHÉM YUKI · Hitbox đỏ / Hurtbox idle xanh</h3><button id="play">Chạy / Dừng</button><button id="prev">← Frame trước</button><button id="next">Frame sau →</button><input id="frame" type="range" min="1" max="62" value="28"><span id="label"></span><br><label><input id="hit" type="checkbox" checked>Hitbox</label><label><input id="hurt" type="checkbox" checked>Hurtbox</label><div><select id="kind"><option value="hurt">Hurtbox</option><option value="hit">Hitbox</option></select><select id="part"><option value="0">Thân / Hitbox 1</option><option value="1">Đầu / Hitbox 2</option></select><div id="fields"></div><button id="save">Lưu vào game</button><span id="status"></span></div><br><canvas width="768" height="512"></canvas><script type="module">
import {yukiSlashHitboxes as anSlashHitboxes} from '/src/yuki-slash.ts';import {capsulePolygon,capsulesFor} from '/src/hurtcapsule.ts';import {hitboxCorners} from '/src/hitbox-model.ts';
import hits from '/src/hitbox-overrides.json';import hurts from '/src/capsule-overrides.json';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),slider=document.querySelector('#frame');let running=false,t=0,last=performance.now();const pages=await Promise.all(Array.from({length:16},(_,i)=>new Promise(resolve=>{const im=new Image();im.onload=()=>resolve(im);im.src=`/characters/yuki/slash-62-pages/${i}.png`})));
document.querySelector('#play').onclick=()=>{running=!running;t=(slider.value-1)*.6/62};slider.oninput=()=>running=false;
function stepFrame(delta){running=false;slider.value=Math.max(1,Math.min(62,Number(slider.value)+delta));}
document.querySelector('#prev').onclick=()=>stepFrame(-1);document.querySelector('#next').onclick=()=>stepFrame(1);

function poly(points,color){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x+128,p.y):ctx.moveTo(p.x+128,p.y));ctx.closePath();ctx.fillStyle=color+'33';ctx.strokeStyle=color;ctx.lineWidth=2;ctx.fill();ctx.stroke()}

const dirtyHit={},dirtyHurt={},inputs={};let drag,lastField='';
const key=f=>`yuki/sword_attack/${f-1}`;
function hitAt(f){return dirtyHit[key(f)]??hits[key(f)]??anSlashHitboxes((f-.5)*.6/62)}
function hurtAt(f){return dirtyHurt[key(f)]??hurts[key(f)]??hurts['yuki/idle/0']??[{x:0,y:0,width:130,part:'body'},{x:0,y:0,width:70,part:'head'}]}
function selected(){const f=+slider.value,kind=document.querySelector('#kind').value,index=+document.querySelector('#part').value;return {f,kind,index,b:(kind==='hit'?hitAt(f):hurtAt(f))[index]}}
function edit(change){const {f,kind,index,b}=selected();if(!b)return;const arr=(kind==='hit'?hitAt(f):hurtAt(f)).map(e=>({...e}));arr[index]={...b,...change};(kind==='hit'?dirtyHit:dirtyHurt)[key(f)]=arr;document.querySelector('#status').textContent='Chưa lưu';lastField=''}
for(const name of ['x','y','width','height','angle']){const label=document.createElement('label');label.textContent=name;const input=document.createElement('input');input.type='number';input.style.width='64px';input.oninput=()=>edit({[name]:+input.value});label.append(input);document.querySelector('#fields').append(label);inputs[name]=input}
function syncFields(f){const {kind,index,b}=selected(),id=[f,kind,index].join('/');if(id===lastField)return;for(const [name,input] of Object.entries(inputs)){input.disabled=!b||(kind==='hurt'&&name==='height');input.value=b?.[name]??0}lastField=id}
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*768/r.width-128,y:(e.clientY-r.top)*512/r.height}}
function inside(p,pts){let yes=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)yes=!yes}return yes}
canvas.style.touchAction='none';canvas.style.cursor='move';canvas.onpointerdown=e=>{running=false;const p=point(e),f=+slider.value;let found;for(const [i,b] of hitAt(f).entries())if(inside(p,hitboxCorners(b)))found={kind:'hit',index:i,b};if(!found)for(const [i,b] of hurtAt(f).entries())if(inside(p,capsulePolygon('yuki','idle',0,b).points))found={kind:'hurt',index:i,b};if(!found)return;document.querySelector('#kind').value=found.kind;document.querySelector('#part').value=found.index;drag={p,b:{...found.b}};lastField='';canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!drag)return;const p=point(e);edit({x:drag.b.x+p.x-drag.p.x,y:drag.b.y+p.y-drag.p.y})};canvas.onpointerup=canvas.onpointercancel=()=>drag=undefined;
document.querySelector('#save').onclick=async()=>{try{for(const [kind,overrides] of [['hitboxes',dirtyHit],['capsules',dirtyHurt]]){if(!Object.keys(overrides).length)continue;const response=await fetch('/__dojo/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overrides})});const data=await response.json();if(!response.ok)throw Error(data.error)}document.querySelector('#status').textContent='Đã lưu vào game'}catch(e){document.querySelector('#status').textContent=e.message}};
function draw(now){if(running){t=(t+(now-last)/1000)% .6;slider.value=Math.min(62,Math.floor(t*62/.6)+1)}last=now;const f=Number(slider.value),i=f-1,k=i%4;ctx.clearRect(0,0,768,512);ctx.drawImage(pages[Math.floor(i/4)],k%2*768,Math.floor(k/2)*512,768,512,0,0,768,512);if(document.querySelector('#hurt').checked)for(const p of hurtAt(f).map(e=>capsulePolygon('yuki','idle',0,e)))poly(p.points,'#00ff88');if(document.querySelector('#hit').checked)for(const b of hitAt(f))poly(hitboxCorners(b),'#ff2244');syncFields(f);document.querySelector('#label').textContent=`Frame ${f}/62 · 0,6 giây`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script>
<script type="module"></script>
