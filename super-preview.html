<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chỉnh hitbox SUPER Yuki</title><style>body{margin:0;background:#162131;color:#e6f7ff;font:15px system-ui;text-align:center}canvas{display:block;margin:auto;max-width:100%;height:auto;background:#aab9ca;touch-action:none;cursor:move}header{padding:10px}button,input,select{margin:5px;padding:6px}input[type=range]{width:260px}input[type=number]{width:72px}button{cursor:pointer}#status{min-height:22px;color:#8ce5ff}</style><header><b>CHỈNH HITBOX SUPER YUKI</b> · Kéo khung đỏ để di chuyển<br><button id="play">Chạy</button><button id="prev">←</button><button id="next">→</button><select id="speed"><option value="1">1× — 1,5 giây</option><option value=".25" selected>0,25×</option><option value=".1">0,1×</option></select><br><input id="frame" type="range" min="1" max="100" value="7"><span id="label"></span><div id="fields"></div><button id="save">Lưu vào game</button><div id="status"></div></header><canvas width="512" height="512"></canvas><script type="module">
import {superStrike} from '/src/yuki-super.ts';
import stored from '/src/super-hitbox-overrides.json';
import {hitboxCorners} from '/src/hitbox-model.ts';
const $=s=>document.querySelector(s),canvas=$('canvas'),ctx=canvas.getContext('2d'),slider=$('#frame');let running=false,t=6*1.5/100,last=performance.now(),shown=-1,dirty={},drag;
const fields={};for(const [key,name] of Object.entries({x:'X',y:'Y',width:'Rộng',height:'Cao',angle:'Góc xoay'})){const label=document.createElement('label');label.textContent=name;const input=document.createElement('input');input.type='number';input.step='1';label.append(input);$('#fields').append(label);fields[key]=input;input.oninput=()=>{const frame=current()+1,b=boxAt(frame);if(!b)return;dirty[frame]={...b,[key]:Number(input.value)};$('#status').textContent='Chưa lưu';};}
const pages=await Promise.all(Array.from({length:13},(_,i)=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=`/characters/yuki/super-pages/${i}.png`})));
function current(){return Math.min(99,Math.floor(t*100/1.5+1e-7))}function boxAt(frame){return dirty[frame]??stored[frame]??superStrike((frame-.5)*1.5/100)?.box}
function setFrame(frame){running=false;$('#play').textContent='Chạy';t=(Math.max(1,Math.min(100,frame))-1)*1.5/100;shown=-1}
$('#play').onclick=()=>{running=!running;$('#play').textContent=running?'Tạm dừng':'Chạy'};slider.oninput=()=>setFrame(Number(slider.value));$('#prev').onclick=()=>setFrame(current());$('#next').onclick=()=>setFrame(current()+2);
$('#save').onclick=async()=>{const button=$('#save');button.disabled=true;try{const response=await fetch('/__dojo/super-hitboxes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overrides:dirty})});const data=await response.json();if(!response.ok)throw Error(data.error);Object.assign(stored,dirty);dirty={};$('#status').textContent='Đã lưu vào game';}catch(e){$('#status').textContent=e.message}finally{button.disabled=false}};
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*512/r.width,y:(e.clientY-r.top)*512/r.height}}
canvas.onpointerdown=e=>{const b=boxAt(current()+1);if(!b)return;setFrame(current()+1);drag={point:point(e),box:{...b},frame:current()+1};canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;const p=point(e);dirty[drag.frame]={...drag.box,x:drag.box.x+p.x-drag.point.x,y:drag.box.y+p.y-drag.point.y};shown=-1;$('#status').textContent='Chưa lưu'};canvas.onpointerup=canvas.onpointercancel=()=>drag=undefined;
function draw(now){if(running)t=(t+(now-last)/1000*Number($('#speed').value))%1.5;last=now;const index=current(),cell=index%8,frame=index+1;ctx.clearRect(0,0,512,512);ctx.drawImage(pages[Math.floor(index/8)],cell%4*512,Math.floor(cell/4)*512,512,512,0,0,512,512);const strike=superStrike((frame-.5)*1.5/100),b=boxAt(frame);if(b){const pts=hitboxCorners(b);ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle='#ff224444';ctx.strokeStyle='#ff163e';ctx.lineWidth=3;ctx.fill();ctx.stroke()}if(shown!==index){for(const [key,input] of Object.entries(fields)){input.disabled=!b;input.value=b?Math.round(b[key]??0):''}shown=index}slider.value=frame;$('#label').textContent=`Frame ${frame}/100${strike?' · '+(strike.action==='kick'?'ĐÁ':'ĐẤM '+(strike.stage+1)):' · Không ra đòn'}`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
