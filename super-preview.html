<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chỉnh hitbox SUPER Yuki</title><style>body{margin:0;background:#162131;color:#e6f7ff;font:15px system-ui;text-align:center}canvas{display:block;margin:auto;max-width:100%;height:auto;background:#aab9ca;touch-action:none;cursor:move}header{padding:10px}button,input,select{margin:5px;padding:6px}input[type=range]{width:260px}input[type=number]{width:72px}button{cursor:pointer}#status{min-height:22px;color:#8ce5ff}</style><header><b>CHỈNH HITBOX SUPER YUKI</b> · Kéo trực tiếp khung xanh (đầu/thân) hoặc khung đỏ<br><button id="play">Chạy</button><button id="prev">←</button><button id="next">→</button><select id="speed"><option value="1">1× — 1,5 giây</option><option value=".25" selected>0,25×</option><option value=".1">0,1×</option></select><br><input id="frame" type="range" min="1" max="100" value="7"><span id="label"></span><div><label><input id="show-hurt" type="checkbox" checked>Hurtbox xanh</label><label><input id="show-hit" type="checkbox" checked>Hitbox đỏ</label></div><div id="fields"></div><div id="hurt-fields"><b>Hurtbox:</b><select id="hurt-part"><option value="0">Thân</option><option value="1">Đầu</option></select></div><button id="save">Lưu vào game</button><div id="status"></div></header><canvas width="512" height="512"></canvas><script type="module">
import {superStrike,superFrameIndex} from '/src/yuki-super.ts';
import stored from '/src/super-hitbox-overrides.json';
import {hitboxCorners} from '/src/hitbox-model.ts';
import {superCapsuleEdits,superHurtboxes} from '/src/super-hurtboxes.ts';
const $=s=>document.querySelector(s),canvas=$('canvas'),ctx=canvas.getContext('2d'),slider=$('#frame');let running=false,t=6*1.5/99,last=performance.now(),shown=-1,dirty={},dirtyHurt={},drag;
const fields={};for(const [key,name] of Object.entries({x:'X',y:'Y',width:'Rộng',height:'Cao',angle:'Góc xoay'})){const label=document.createElement('label');label.textContent=name;const input=document.createElement('input');input.type='number';input.step='1';label.append(input);$('#fields').append(label);fields[key]=input;input.oninput=()=>{const frame=current()+1,b=boxAt(frame);if(!b)return;dirty[frame]={...b,[key]:Number(input.value)};$('#status').textContent='Chưa lưu';};}
const hurtFields={};let selectedHurt=0;
function hurtEdits(frame){return dirtyHurt[frame]??superCapsuleEdits(frameTime(frame))}
function editHurt(frame,index,change){dirtyHurt[frame]=hurtEdits(frame).map((b,i)=>i===index?{...b,...change}:{...b});$('#status').textContent='Chưa lưu'}
for(const [key,name] of Object.entries({x:'X',y:'Y',width:'Rộng',angle:'Góc xoay'})){const label=document.createElement('label');label.textContent=name;const input=document.createElement('input');input.type='number';input.step='1';label.append(input);$('#hurt-fields').append(label);hurtFields[key]=input;input.oninput=()=>editHurt(current()+1,selectedHurt,{[key]:Number(input.value)});}
$('#hurt-part').onchange=()=>{selectedHurt=Number($('#hurt-part').value);shown=-1};
const pages=await Promise.all(Array.from({length:13},(_,i)=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=`/characters/yuki/super-pages/${i}.png`})));
function current(){return superFrameIndex(t)}function frameTime(frame){const index=frame-1;return ((index>=67?index-1:index)+.5)*1.5/99}function boxAt(frame){return dirty[frame]??stored[frame]??superStrike(frameTime(frame))?.box}
function setFrame(frame){running=false;$('#play').textContent='Chạy';let source=Math.max(1,Math.min(100,frame));if(source===67)source=68;const index=source-1;t=(index>=67?index-1:index)*1.5/99;shown=-1}
$('#play').onclick=()=>{running=!running;$('#play').textContent=running?'Tạm dừng':'Chạy'};slider.oninput=()=>setFrame(Number(slider.value));$('#prev').onclick=()=>setFrame(current()===67?66:current());$('#next').onclick=()=>setFrame(current()+2);
$('#save').onclick=async()=>{const button=$('#save');button.disabled=true;try{for(const [kind,overrides] of [['super-hitboxes',dirty],['super-hurtboxes',dirtyHurt]]){if(!Object.keys(overrides).length)continue;const response=await fetch('/__dojo/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overrides})});const data=await response.json();if(!response.ok)throw Error(data.error);}Object.assign(stored,dirty);dirty={};$('#status').textContent='Đã lưu hitbox và hurtbox vào game';}catch(e){$('#status').textContent=e.message}finally{button.disabled=false}};
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*512/r.width,y:(e.clientY-r.top)*512/r.height}}
function inside(p,points){let yes=false;for(let i=0,j=points.length-1;i<points.length;j=i++){const a=points[i],b=points[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)yes=!yes;}return yes}
canvas.onpointerdown=e=>{const frame=current()+1,p=point(e),edits=hurtEdits(frame),polys=superHurtboxes(frameTime(frame),edits);let index=-1;if($('#show-hurt').checked)for(let i=polys.length-1;i>=0;i--)if(inside(p,polys[i].points)){index=i;break;}
if(index>=0){selectedHurt=index;$('#hurt-part').value=index;setFrame(frame);drag={kind:'hurt',point:p,box:{...edits[index]},frame,index};}
else{const b=boxAt(frame);if(!b||!$('#show-hit').checked||!inside(p,hitboxCorners(b)))return;setFrame(frame);drag={kind:'hit',point:p,box:{...b},frame};}canvas.setPointerCapture(e.pointerId);shown=-1};
canvas.onpointermove=e=>{if(!drag)return;const p=point(e),change={x:drag.box.x+p.x-drag.point.x,y:drag.box.y+p.y-drag.point.y};if(drag.kind==='hurt')editHurt(drag.frame,drag.index,change);else dirty[drag.frame]={...drag.box,...change};shown=-1;$('#status').textContent='Chưa lưu'};canvas.onpointerup=canvas.onpointercancel=()=>drag=undefined;
function draw(now){if(running)t=(t+(now-last)/1000*Number($('#speed').value))%1.5;last=now;const index=current(),cell=index%8,frame=index+1;ctx.clearRect(0,0,512,512);ctx.drawImage(pages[Math.floor(index/8)],cell%4*512,Math.floor(cell/4)*512,512,512,0,0,512,512);const strike=superStrike(frameTime(frame)),b=boxAt(frame);if($('#show-hurt').checked){for(const poly of superHurtboxes(frameTime(frame),hurtEdits(frame))){ctx.beginPath();poly.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle='#26ee8833';ctx.strokeStyle='#00bb60';ctx.lineWidth=2;ctx.fill();ctx.stroke();}}if(b&&$('#show-hit').checked){const pts=hitboxCorners(b);ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle='#ff224444';ctx.strokeStyle='#ff163e';ctx.lineWidth=3;ctx.fill();ctx.stroke()}if(shown!==index){for(const [key,input] of Object.entries(fields)){input.disabled=!b;input.value=b?Math.round(b[key]??0):''}const edit=hurtEdits(frame)[selectedHurt];for(const [key,input] of Object.entries(hurtFields)){input.disabled=!edit;input.value=edit?Math.round(edit[key]??0):''}shown=index}slider.value=frame;$('#label').textContent=`Frame gốc ${frame}/100 · 99 frame (bỏ 67)${strike?' · '+(strike.action==='kick'?'ĐÁ':'ĐẤM '+(strike.stage+1)):' · Không ra đòn'}`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
