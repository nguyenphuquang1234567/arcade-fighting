<!doctype html><html lang="vi"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadow Dojo · Capsule preview</title><style>body{background:#181822;color:#eee;font:16px system-ui;max-width:850px;margin:24px auto;padding:16px}select,input,button{font:inherit;padding:8px;background:#292936;color:white;border:1px solid #777;border-radius:6px}label{display:inline-block;margin:8px}canvas{width:100%;max-width:700px;background:repeating-conic-gradient(#30303e 0% 25%,#252532 0% 50%) 0/32px 32px}a{color:#9ee7cb}</style><h2>Capsule thân + chân</h2><p>Hurtbox đang dùng trong game. Xanh: capsule thân + chân. Vàng: capsule đầu, chỉnh được như thân. Giữ chuột trong capsule rồi kéo để di chuyển. Vị trí và độ rộng giữ riêng từng frame. Bấm Lưu mã nguồn để ghi vào dự án. Kéo độ rộng để so sánh.</p><select id="who"><option value="moon">Ronin</option><option value="ember">Ember</option></select> <select id="action"></select><label>Frame <input id="frame" type="number" min="1" value="1" max="2" style="width:60px"></label><label>Độ rộng <input id="width" type="range" min="50" max="240" value="130"></label><label>Góc xoay <input id="angle" type="range" min="-180" max="180" value="0"> <span id="angle-value">0°</span></label><p><select id="capsule" aria-label="Capsule"></select> <button id="add-capsule">Thêm capsule</button> <button id="delete-capsule">Xóa capsule</button></p><p><button id="save-source">Lưu mã nguồn (dev)</button> <span id="save-status"></span></p><canvas id="canvas" width="512" height="512"></canvas><p id="info"></p><a href="/">Về game</a><script type="module" src="/src/capsule-preview.ts"></script></html>
