<!doctype html><meta charset="utf-8"><title>Hitbox / Hurtbox ULTI An</title><style>body{background:#182131;color:white;font:16px system-ui;text-align:center}canvas{background:#536575;max-width:100%;height:auto}button,input{margin:8px}</style><h3>ULTI AN · Hitbox đỏ / Hurtbox xanh</h3><button id="play">Chạy / Dừng</button><button id="prev">← Frame trước</button><button id="next">Frame sau →</button><input id="frame" type="range" min="1" max="100" value="30"><span id="label"></span><br><label><input id="hit" type="checkbox" checked>Hitbox</label><label><input id="hurt" type="checkbox" checked>Hurtbox</label><button id="face">Đổi hướng</button><div><select id="kind"><option value="hit">Hitbox</option><option value="hurt">Hurtbox</option></select><select id="part"><option value="0">Thân / Hitbox 1</option><option value="1">Đầu / Hitbox 2</option></select><div id="fields"></div><button id="save">Lưu vào game</button><span id="status"></span></div><br><canvas width="1280" height="720"></canvas><script type="module">
import seams from '/src/an-ulti-seams.json';
import {ultiBoxEdits,ultiHurtPoints} from '/src/an-ulti-boxes.ts';
import {getHitboxes,getHurtboxes} from '/src/geometry.ts';import {hitboxCorners} from '/src/hitbox-model.ts';import {AN_ULTI_SCALE as scale,AN_ULTI_ORIGIN_X as ox,AN_ULTI_ORIGIN_Y as oy} from '/src/an-ulti.ts';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),slider=document.querySelector('#frame');let running=false,t=0,last=performance.now(),face=1;
const load=src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src});const pages=await Promise.all(Array.from({length:25},(_,i)=>load(`/characters/an/ulti-pages/${i}.webp`)));const beams=await Promise.all(Array.from({length:25},(_,i)=>load(`/characters/an/ulti-pages/beam-${i}.webp`)));
function step(n){running=false;slider.value=Math.max(1,Math.min(100,+slider.value+n))}document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);slider.oninput=()=>running=false;document.querySelector('#face').onclick=()=>face=-face;document.querySelector('#play').onclick=()=>{running=!running;t=(+slider.value-1)/25};
function poly(points,color){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=color+'33';ctx.strokeStyle=color;ctx.lineWidth=2;ctx.fill();ctx.stroke()}

const draftKey='dojo-an-ulti-box-draft-v1';let dirty={};try{dirty=JSON.parse(localStorage.getItem(draftKey)||'{}')}catch{}const inputs={};let drag,lastFields='';
const fighter=i=>({x:640,y:0,face:1,hp:250,collisionSkin:'an',action:'idle',time:0,ultiTime:(i+.5)/25});
function boxes(i,kind){if(kind==='hit'&&i<13)return [];if(dirty[i]?.[kind])return dirty[i][kind];if(ultiBoxEdits[i]?.[kind])return ultiBoxEdits[i][kind];const f=fighter(i);if(kind==='hit')return getHitboxes(f);return getHurtboxes(f).map(p=>{const xs=p.points.map(p=>p.x),ys=p.points.map(p=>p.y);return {x:Math.min(...xs),y:Math.min(...ys),width:Math.max(...xs)-Math.min(...xs),height:Math.max(...ys)-Math.min(...ys),angle:0}})}
function selected(){const i=+slider.value-1,kind=document.querySelector('#kind').value,index=+document.querySelector('#part').value;return {i,kind,index,b:boxes(i,kind)[index]}}
function remember(){localStorage.setItem(draftKey,JSON.stringify(dirty));document.querySelector('#status').textContent='Bản nháp đã lưu trên trình duyệt; chưa lưu game';lastFields=''}
function edit(change){const {i,kind,index,b}=selected();if(!b)return;const arr=boxes(i,kind).map(b=>({...b}));arr[index]={...b,...change};dirty[i]={...dirty[i],[kind]:arr};remember()}
for(const name of ['x','y','width','height','angle']){const label=document.createElement('label');label.textContent=name;const input=document.createElement('input');input.type='number';input.step='1';input.style.width='75px';input.oninput=()=>edit({[name]:+input.value});label.append(input);document.querySelector('#fields').append(label);inputs[name]=input}
function sync(){const {i,kind,index,b}=selected(),id=[i,kind,index].join('/');if(id===lastFields)return;for(const [name,input] of Object.entries(inputs)){input.disabled=!b;input.value=b?Math.round(b[name]??0):''}lastFields=id}
function worldPoints(b,kind='hit',index=0){return (kind==='hurt'?ultiHurtPoints(b,index):hitboxCorners(b)).map(p=>({x:640+face*(p.x-640),y:p.y}))}
function inside(p,pts){let yes=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)yes=!yes}return yes}
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*1280/r.width,y:(e.clientY-r.top)*720/r.height}}
canvas.style.touchAction='none';canvas.style.cursor='move';canvas.onpointerdown=e=>{running=false;const p=point(e),i=+slider.value-1;let found;for(const kind of ['hurt','hit']){if(!document.querySelector('#'+kind).checked)continue;for(const [index,b] of boxes(i,kind).entries())if(inside(p,worldPoints(b,kind,index)))found={kind,index,b}}if(!found)return;document.querySelector('#kind').value=found.kind;document.querySelector('#part').value=found.index;drag={p,b:{...found.b}};lastFields='';canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!drag)return;const p=point(e);edit({x:drag.b.x+face*(p.x-drag.p.x),y:drag.b.y+p.y-drag.p.y})};canvas.onpointerup=canvas.onpointercancel=()=>drag=undefined;
document.querySelector('#save').onclick=async()=>{try{const response=await fetch('/__dojo/an-ulti-boxes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({overrides:dirty})}),data=await response.json();if(!response.ok)throw Error(data.error);Object.assign(ultiBoxEdits,dirty);dirty={};localStorage.removeItem(draftKey);document.querySelector('#status').textContent='Đã lưu vào game'}catch(e){document.querySelector('#status').textContent=e.message}};
function draw(now){if(running){t=(t+(now-last)/1000)%4;slider.value=Math.floor(t*25)+1}last=now;const i=+slider.value-1,p=Math.floor(i/4),k=i%4,seam=i<13?768:(seams[i]??672);const f={x:640,y:0,face,hp:250,collisionSkin:'an',action:'idle',time:0,ultiTime:(i+.5)/25};ctx.clearRect(0,0,1280,720);ctx.save();ctx.translate(f.x,665);ctx.scale(face,1);ctx.drawImage(pages[p],k%2*768,Math.floor(k/2)*432,seam,432,-ox*scale,-oy*scale,seam*scale,432*scale);const start=(seam-ox)*scale,width=face>0?1280-f.x-start:f.x-start;for(let offset=0,tile=0;i>=13&&offset<Math.max(0,width);offset+=96*scale,tile++){const w=Math.min(96*scale,width-offset);ctx.save();ctx.beginPath();ctx.rect(start+offset,-oy*scale,w,432*scale);ctx.clip();ctx.translate(start+offset+(tile%2===0?96*scale:0),-oy*scale);ctx.scale(tile%2===0?-1:1,1);ctx.drawImage(pages[p],k%2*768+seam-96,Math.floor(k/2)*432,96,432,0,0,96*scale,432*scale);ctx.restore();}ctx.restore();if(document.querySelector('#hurt').checked)for(const [index,b] of boxes(i,'hurt').entries())poly(worldPoints(b,'hurt',index),'#00ff88');if(document.querySelector('#hit').checked)for(const b of boxes(i,'hit'))poly(worldPoints(b),'#ff2244');sync();document.querySelector('#label').textContent=`Frame ${i+1}/100 · ${((i+.5)/25).toFixed(2)} / 4 giây`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script>
